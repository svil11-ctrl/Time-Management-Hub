    <h1>Связаться с автором</h1>
    <div class="text">
        <h2>Оставьте сообщение или задайте вопрос</h2>
        <h3>Заполните форму ниже, либо воспользуйтесь прямыми контактами.</h3>
    </div>

    <div class="app-container">
        <section class="card-section contact-section">
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="user-name">Ваше имя:</label>
                    <input type="text" id="user-name" placeholder="Введите ваше имя" required>
                </div>

                <div class="form-group">
                    <label for="user-email">Ваш E-mail:</label>
                    <input type="email" id="user-email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="user-message">Сообщение:</label>
                    <textarea id="user-message" rows="3" placeholder="Введите ваше сообщение..." required></textarea>
                </div>

                <button type="submit" id="submit-btn" class="btn-start" disabled>Отправить</button>
            </form>

            <div id="status-message" class="status-box" style="display: none;"></div>
        </section>

    
        <section class="card-section" style="margin-top: 20px; text-align: center;">
